{% extends "base.html" %}
{% block title %}Edit Profile — SkillSwap{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="fw-bold mb-3">Edit Profile</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">College</label>
          <input type="text" name="college" class="form-control" value="{{ user.college or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Course / Department</label>
          <input type="text" name="department" class="form-control" value="{{ user.department or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Year</label>
          <select name="year" class="form-select">
            {% for y in ["1st Year", "2nd Year", "3rd Year", "4th Year"] %}
              <option {% if user.year == y %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-accent w-100">Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
