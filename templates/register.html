{% extends "base.html" %}
{% block title %}Register — SkillSwap{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="fw-bold mb-1">Create your account</h3>
      <p class="text-muted mb-4">Join SkillSwap and get 100 SkillCoins on the house.</p>
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required autofocus>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <div class="col-md-6">
            <label class="form-label">College</label>
            <input type="text" name="college" class="form-control" placeholder="e.g. CGC Jhanjeri">
          </div>
          <div class="col-md-6">
            <label class="form-label">Course / Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. AI & Data Science">
          </div>
          <div class="col-md-6">
            <label class="form-label">Year</label>
            <select name="year" class="form-select">
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-accent w-100 mt-4">Create Account</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
